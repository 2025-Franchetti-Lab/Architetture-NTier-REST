<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architetture N-Tier &amp; REST</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4fa;
      color: #222;
      padding: 2rem;
    }

    h1 {
      text-align: center;
      margin-bottom: 2.5rem;
      font-size: 1.8rem;
      color: #1a5fa8;
      letter-spacing: 0.02em;
    }

    /* ── Sezioni ── */
    section {
      margin-bottom: 3rem;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.2rem;
      font-weight: 700;
      color: #1a5fa8;
      margin-bottom: 1.2rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid #c5d8f5;
    }

    .section-icon {
      font-size: 1.4rem;
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    /* ── Card base ── */
    .card {
      background: #ffffff;
      border: 1px solid #d0d8e8;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }

    /* ── Card: sezione HTML ── */
    .card-html .card-body {
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      flex: 1;
    }

    .badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 4px;
      text-transform: uppercase;
      width: fit-content;
    }

    .badge-html { background: #2980b9; color: #fff; }
    .badge-mp4  { background: #c0392b; color: #fff; }

    .filename {
      font-size: 0.95rem;
      word-break: break-word;
      color: #333;
      font-weight: 500;
    }

    .card a.btn {
      display: block;
      text-align: center;
      text-decoration: none;
      padding: 0.55rem;
      border-radius: 6px;
      font-size: 0.88rem;
      margin-top: auto;
      transition: background 0.15s;
      color: #fff;
    }

    .card-html .btn { background: #1a5fa8; }
    .card-html .btn:hover { background: #154d8a; }

    /* ── Card: sezione Video ── */
    .card-video .video-wrapper {
      position: relative;
      background: #000;
      line-height: 0;
    }

    .card-video video {
      width: 100%;
      display: block;
      max-height: 180px;
      object-fit: cover;
    }

    .card-video .card-body {
      padding: 1rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      flex: 1;
    }

    .card-video .btn { background: #c0392b; }
    .card-video .btn:hover { background: #a93226; }
  </style>
</head>
<body>

  <h1>Architetture N-Tier &amp; REST</h1>

  <!-- ══════════════════════════════════════════
       SEZIONE 1 — Pagine HTML
       ══════════════════════════════════════════ -->
  <section>
    <div class="section-title">
      <span class="section-icon">📄</span>
      Pagine HTML
    </div>
    <div class="grid">

      <div class="card card-html">
        <div class="card-body">
          <span class="badge badge-html">HTML</span>
          <span class="filename">architetture_web_ntier.html</span>
          <a class="btn" href="architetture_web_ntier.html" target="_blank">Apri pagina</a>
        </div>
      </div>

      <div class="card card-html">
        <div class="card-body">
          <span class="badge badge-html">HTML</span>
          <span class="filename">proxy_gateway_loadbalancer.html</span>
          <a class="btn" href="proxy_gateway_loadbalancer.html" target="_blank">Apri pagina</a>
        </div>
      </div>

    </div>
  </section>

  <!-- ══════════════════════════════════════════
       SEZIONE 2 — Video
       ══════════════════════════════════════════ -->
  <section>
    <div class="section-title">
      <span class="section-icon">🎬</span>
      Video
    </div>
    <div class="grid">

      <div class="card card-video">
        <div class="video-wrapper">
          <video preload="metadata" controls>
            <source src="Architetture_N-Tier.mp4" type="video/mp4">
          </video>
        </div>
        <div class="card-body">
          <span class="badge badge-mp4">MP4</span>
          <span class="filename">Architetture_N-Tier.mp4</span>
          <a class="btn" href="Architetture_N-Tier.mp4" target="_blank">Apri in nuova scheda</a>
        </div>
      </div>

      <div class="card card-video">
        <div class="video-wrapper">
          <video preload="metadata" controls>
            <source src="Proxy_Gateway_&amp;_Load_Balancer.mp4" type="video/mp4">
          </video>
        </div>
        <div class="card-body">
          <span class="badge badge-mp4">MP4</span>
          <span class="filename">Proxy_Gateway_&amp;_Load_Balancer.mp4</span>
          <a class="btn" href="Proxy_Gateway_&amp;_Load_Balancer.mp4" target="_blank">Apri in nuova scheda</a>
        </div>
      </div>

    </div>
  </section>

</body>
</html>
